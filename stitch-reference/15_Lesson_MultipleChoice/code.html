<!DOCTYPE html><html lang="vi"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Multiple Choice Exercise</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed-dim": "#c7c6c4",
                        "on-secondary": "#ffffff",
                        "surface-container-highest": "#e5e2e1",
                        "primary": "#ac001e",
                        "on-surface": "#1b1b1b",
                        "error-container": "#ffdad6",
                        "secondary-fixed": "#e3e2e0",
                        "primary-fixed-dim": "#ffb3af",
                        "tertiary-fixed": "#b1f0ce",
                        "surface-container-low": "#f6f3f2",
                        "surface-bright": "#fcf9f8",
                        "primary-fixed": "#ffdad7",
                        "inverse-primary": "#ffb3af",
                        "surface": "#fcf9f8",
                        "surface-dim": "#dcd9d9",
                        "on-primary": "#ffffff",
                        "on-primary-fixed": "#410005",
                        "inverse-surface": "#313030",
                        "tertiary-fixed-dim": "#95d4b3",
                        "on-secondary-fixed-variant": "#464745",
                        "surface-variant": "#e5e2e1",
                        "error": "#ba1a1a",
                        "tertiary": "#205e44",
                        "secondary-container": "#e0e0dd",
                        "surface-container-high": "#eae7e7",
                        "primary-container": "#d90429",
                        "tertiary-container": "#3b775b",
                        "outline": "#926e6c",
                        "on-tertiary-fixed": "#002114",
                        "surface-container": "#f0eded",
                        "on-tertiary-container": "#bcfcd9",
                        "on-primary-container": "#ffeae8",
                        "on-primary-fixed-variant": "#930018",
                        "background": "#fcf9f8",
                        "on-error-container": "#93000a",
                        "inverse-on-surface": "#f3f0ef",
                        "on-background": "#1b1b1b",
                        "on-error": "#ffffff",
                        "surface-tint": "#bf0022",
                        "on-secondary-fixed": "#1a1c1a",
                        "on-secondary-container": "#626361",
                        "surface-container-lowest": "#ffffff",
                        "secondary": "#5e5f5d",
                        "on-tertiary-fixed-variant": "#0e5138",
                        "outline-variant": "#e7bcba",
                        "on-tertiary": "#ffffff",
                        "on-surface-variant": "#5d3f3d"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xl": "32px",
                        "md": "16px",
                        "lg": "24px",
                        "base": "4px",
                        "xs": "8px",
                        "sm": "12px",
                        "gutter": "16px",
                        "container-margin": "20px"
                    },
                    "fontFamily": {
                        "label-sm": ["Inter"],
                        "display-hanzi": ["Noto Sans SC"],
                        "headline-lg-mobile": ["Montserrat"],
                        "headline-lg": ["Montserrat"],
                        "pinyin-md": ["Inter"],
                        "body-vn": ["Inter"]
                    },
                    "fontSize": {
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "600" }],
                        "display-hanzi": ["64px", { "lineHeight": "80px", "fontWeight": "500" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "34px", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "700" }],
                        "pinyin-md": ["18px", { "lineHeight": "24px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "body-vn": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #fcf9f8; /* background */
            color: #1b1b1b; /* on-background */
            min-height: max(884px, 100dvh);
        }
        .option-card {
            transition: all 0.2s ease-in-out;
            box-shadow: 0px 4px 20px rgba(172, 0, 30, 0.05); /* Soft, warm shadow */
            border: 1px solid #E8E6DF; /* Ivory border */
            background-color: #ffffff; /* surface-container-lowest */
        }
        .option-card:hover {
            transform: translateY(-2px);
            box-shadow: 0px 8px 24px rgba(172, 0, 30, 0.08);
            border-color: #e7bcba; /* outline-variant */
        }
        .option-card:active {
            transform: translateY(0);
        }
        .option-card.selected {
            border: 1.5px solid #ac001e; /* primary */
            background-color: #fffafa; /* very slight red tint */
            box-shadow: 0px 4px 20px rgba(172, 0, 30, 0.1);
        }
        .option-card.selected .option-label {
            background-color: #ac001e;
            color: #ffffff;
            border-color: #ac001e;
        }
        
        .progress-bar-track {
            background-color: #e0e0dd; /* secondary-container */
        }
        .progress-bar-fill {
            background-color: #205e44; /* tertiary (Jade) */
        }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">
<!-- Top AppBar (Lesson Shell) -->
<header class="flex flex-col bg-surface w-full z-50 shrink-0 relative">
  <div class="flex items-center justify-between px-container-margin h-14 w-full">
    <button class="p-2 -ml-2 text-on-surface-variant hover:bg-surface-container-low rounded-full transition-colors active:scale-95 duration-200">
      <span class="material-symbols-outlined">close</span>
    </button>
    <h2 class="font-headline-lg-mobile text-body-vn font-bold text-on-surface">Bài học</h2>
    <button class="p-2 -mr-2 text-on-surface-variant hover:bg-surface-container-low rounded-full transition-colors active:scale-95 duration-200">
      <span class="material-symbols-outlined">more_horiz</span>
    </button>
  </div>
  <div class="px-container-margin pb-2">
    <div class="w-full h-2 progress-bar-track rounded-full overflow-hidden">
      <div class="h-full progress-bar-fill rounded-full" style="width: 40%;"></div>
    </div>
  </div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col px-container-margin py-lg overflow-y-auto w-full max-w-2xl mx-auto">
<!-- Question Section -->
<div class="flex flex-col items-center justify-center text-center mt-xl mb-xl space-y-sm shrink-0">
<h1 class="font-display-hanzi text-[44px] leading-[56px] sm:text-[56px] sm:leading-[64px] text-on-surface whitespace-nowrap tracking-wide">你是哪国人？</h1>
<p class="font-pinyin-md text-pinyin-md text-secondary mb-1">nǐ shì nǎ guó rén?</p>
<p class="font-body-vn text-body-vn text-on-surface-variant">nghĩa là gì?</p>
</div>
<!-- Options Container -->
<div class="flex flex-col space-y-md w-full flex-grow">
<!-- Option A -->
<button class="option-card rounded-xl p-md flex items-center justify-start text-left w-full focus:outline-none min-h-[72px]">
<div class="w-8 h-8 rounded-full border border-surface-dim bg-surface-container-lowest flex items-center justify-center mr-sm shrink-0 font-label-sm text-on-surface-variant option-label transition-colors duration-200">A</div>
<span class="font-body-vn text-body-vn text-on-surface">Bạn tên là gì?</span>
</button>
<!-- Option B -->
<button class="option-card rounded-xl p-md flex items-center justify-start text-left w-full focus:outline-none min-h-[72px]">
<div class="w-8 h-8 rounded-full border border-surface-dim bg-surface-container-lowest flex items-center justify-center mr-sm shrink-0 font-label-sm text-on-surface-variant option-label transition-colors duration-200">B</div>
<span class="font-body-vn text-body-vn text-on-surface">Bạn là người nước nào?</span>
</button>
<!-- Option C -->
<button class="option-card rounded-xl p-md flex items-center justify-start text-left w-full focus:outline-none min-h-[72px]">
<div class="w-8 h-8 rounded-full border border-surface-dim bg-surface-container-lowest flex items-center justify-center mr-sm shrink-0 font-label-sm text-on-surface-variant option-label transition-colors duration-200">C</div>
<span class="font-body-vn text-body-vn text-on-surface">Bạn sống ở đâu?</span>
</button>
<!-- Option D -->
<button class="option-card rounded-xl p-md flex items-center justify-start text-left w-full focus:outline-none min-h-[72px]">
<div class="w-8 h-8 rounded-full border border-surface-dim bg-surface-container-lowest flex items-center justify-center mr-sm shrink-0 font-label-sm text-on-surface-variant option-label transition-colors duration-200">D</div>
<span class="font-body-vn text-body-vn text-on-surface">Bạn bao nhiêu tuổi?</span>
</button>
</div>
</main>
<!-- Bottom Action Area -->
<footer class="p-container-margin w-full max-w-2xl mx-auto shrink-0 pb-safe mb-4">
<!-- Disabled CTA Button -->
<button class="w-full h-[56px] rounded-full bg-surface-container-highest text-on-secondary-fixed-variant font-headline-lg-mobile text-headline-lg-mobile cursor-not-allowed opacity-70 transition-all duration-200" disabled="">
            Kiểm tra
        </button>
</footer>
<script>
        // Simple script to handle option selection and button state
        document.addEventListener('DOMContentLoaded', () => {
            const options = document.querySelectorAll('.option-card');
            const checkBtn = document.querySelector('footer button');

            options.forEach(option => {
                option.addEventListener('click', () => {
                    // Remove selected from all
                    options.forEach(opt => opt.classList.remove('selected'));
                    
                    // Add selected to clicked
                    option.classList.add('selected');

                    // Enable check button
                    checkBtn.disabled = false;
                    checkBtn.classList.remove('bg-surface-container-highest', 'text-on-secondary-fixed-variant', 'cursor-not-allowed', 'opacity-70');
                    checkBtn.classList.add('bg-primary', 'text-on-primary', 'shadow-md', 'active:scale-95');
                });
            });
        });
    </script>


</body></html>
