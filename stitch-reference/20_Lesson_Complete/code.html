<!DOCTYPE html>

<html class="light" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Hoàn thành bài học! - Hanzi Premium</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Montserrat:wght@700&amp;family=Noto+Sans+SC:wght@500&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed-dim": "#c7c6c4",
                        "on-secondary": "#ffffff",
                        "surface-container-highest": "#e5e2e1",
                        "primary": "#ac001e",
                        "on-surface": "#1b1b1b",
                        "error-container": "#ffdad6",
                        "secondary-fixed": "#e3e2e0",
                        "primary-fixed-dim": "#ffb3af",
                        "tertiary-fixed": "#b1f0ce",
                        "surface-container-low": "#f6f3f2",
                        "surface-bright": "#fcf9f8",
                        "primary-fixed": "#ffdad7",
                        "inverse-primary": "#ffb3af",
                        "surface": "#fcf9f8",
                        "surface-dim": "#dcd9d9",
                        "on-primary": "#ffffff",
                        "on-primary-fixed": "#410005",
                        "inverse-surface": "#313030",
                        "tertiary-fixed-dim": "#95d4b3",
                        "on-secondary-fixed-variant": "#464745",
                        "surface-variant": "#e5e2e1",
                        "error": "#ba1a1a",
                        "tertiary": "#205e44",
                        "secondary-container": "#e0e0dd",
                        "surface-container-high": "#eae7e7",
                        "primary-container": "#d90429",
                        "tertiary-container": "#3b775b",
                        "outline": "#926e6c",
                        "on-tertiary-fixed": "#002114",
                        "surface-container": "#f0eded",
                        "on-tertiary-container": "#bcfcd9",
                        "on-primary-container": "#ffeae8",
                        "on-primary-fixed-variant": "#930018",
                        "background": "#fcf9f8",
                        "on-error-container": "#93000a",
                        "inverse-on-surface": "#f3f0ef",
                        "on-background": "#1b1b1b",
                        "on-error": "#ffffff",
                        "surface-tint": "#bf0022",
                        "on-secondary-fixed": "#1a1c1a",
                        "on-secondary-container": "#626361",
                        "surface-container-lowest": "#ffffff",
                        "secondary": "#5e5f5d",
                        "on-tertiary-fixed-variant": "#0e5138",
                        "outline-variant": "#e7bcba",
                        "on-tertiary": "#ffffff",
                        "on-surface-variant": "#5d3f3d"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xl": "32px",
                        "md": "16px",
                        "lg": "24px",
                        "base": "4px",
                        "xs": "8px",
                        "sm": "12px",
                        "gutter": "16px",
                        "container-margin": "20px"
                    },
                    "fontFamily": {
                        "label-sm": ["Inter"],
                        "display-hanzi": ["Noto Sans SC"],
                        "headline-lg-mobile": ["Montserrat"],
                        "headline-lg": ["Montserrat"],
                        "pinyin-md": ["Inter"],
                        "body-vn": ["Inter"]
                    },
                    "fontSize": {
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "600" }],
                        "display-hanzi": ["64px", { "lineHeight": "80px", "fontWeight": "500" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "34px", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "700" }],
                        "pinyin-md": ["18px", { "lineHeight": "24px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "body-vn": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .fade-in-up {
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .delay-100 { animation-delay: 0.1s; }
        .delay-200 { animation-delay: 0.2s; }
        .delay-300 { animation-delay: 0.3s; }
        .delay-400 { animation-delay: 0.4s; }
        .delay-500 { animation-delay: 0.5s; }
        
        .glow-effect {
            box-shadow: 0 0 40px rgba(172, 0, 30, 0.15);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface text-on-surface font-body-vn min-h-screen flex flex-col items-center justify-center relative overflow-hidden pb-safe">
<!-- Ambient Background Glow -->
<div class="absolute inset-0 z-0 pointer-events-none flex justify-center items-center">
<div class="w-[80vw] h-[80vw] max-w-[600px] max-h-[600px] rounded-full bg-primary/5 blur-[100px]"></div>
</div>
<!-- Main Content Canvas -->
<main class="relative z-10 w-full max-w-lg px-container-margin py-xl flex flex-col items-center justify-center min-h-[884px]">
<!-- Celebration Graphic (Premium Abstract) -->
<div class="w-48 h-48 mb-lg fade-in-up flex justify-center items-center relative glow-effect rounded-full bg-surface-container-lowest shadow-[0px_4px_20px_rgba(172,0,30,0.05)] border border-surface-container-high overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-br from-surface to-surface-container-low opacity-50"></div>
<!-- Elegant Hanzi representation of 'Success/Completion' -->
<span class="font-display-hanzi text-display-hanzi text-primary relative z-10 drop-shadow-md">成</span>
</div>
<!-- Heading -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-center mb-xl fade-in-up delay-100">Hoàn thành bài học!</h1>
<!-- Stats Grid (Bento Style) -->
<div class="w-full grid grid-cols-2 gap-md mb-xl fade-in-up delay-200">
<!-- XP Card -->
<div class="bg-surface-container-lowest rounded-xl p-md shadow-[0px_4px_20px_rgba(172,0,30,0.05)] border border-surface-container-high flex flex-col items-center justify-center h-28">
<span class="font-label-sm text-label-sm text-secondary uppercase tracking-wider mb-xs">Kinh nghiệm</span>
<div class="flex items-center gap-base text-tertiary">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="font-headline-lg-mobile text-headline-lg-mobile">+80</span>
</div>
</div>
<!-- Accuracy Card -->
<div class="bg-surface-container-lowest rounded-xl p-md shadow-[0px_4px_20px_rgba(172,0,30,0.05)] border border-surface-container-high flex flex-col items-center justify-center h-28">
<span class="font-label-sm text-label-sm text-secondary uppercase tracking-wider mb-xs">Độ chính xác</span>
<div class="flex items-center gap-base text-on-surface">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-headline-lg-mobile text-headline-lg-mobile">90%</span>
</div>
</div>
<!-- Correct/Total -->
<div class="bg-surface-container-lowest rounded-xl p-md shadow-[0px_4px_20px_rgba(172,0,30,0.05)] border border-surface-container-high flex flex-col items-center justify-center h-24">
<span class="font-label-sm text-label-sm text-secondary uppercase tracking-wider mb-xs">Đúng</span>
<span class="font-pinyin-md text-pinyin-md text-on-surface font-semibold">9 / 10</span>
</div>
<!-- Time -->
<div class="bg-surface-container-lowest rounded-xl p-md shadow-[0px_4px_20px_rgba(172,0,30,0.05)] border border-surface-container-high flex flex-col items-center justify-center h-24">
<span class="font-label-sm text-label-sm text-secondary uppercase tracking-wider mb-xs">Thời gian</span>
<span class="font-pinyin-md text-pinyin-md text-on-surface font-semibold">4:32</span>
</div>
</div>
<!-- Streak Card -->
<div class="w-full bg-gradient-to-r from-surface-bright to-[#fffcf0] rounded-xl p-md shadow-[0px_4px_20px_rgba(172,0,30,0.05)] border border-[#f0e6d2] flex items-center justify-between mb-xl fade-in-up delay-300">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-outline text-[32px]" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
<span class="font-pinyin-md text-pinyin-md text-on-surface font-semibold">Chuỗi học</span>
</div>
<span class="font-headline-lg-mobile text-headline-lg-mobile text-outline">12 <span class="font-body-vn text-body-vn text-secondary font-normal">ngày</span></span>
</div>
<!-- Actions -->
<div class="w-full flex flex-col gap-sm mt-auto mb-lg fade-in-up delay-400">
<button class="w-full h-[56px] bg-primary text-on-primary font-pinyin-md text-pinyin-md rounded-xl flex items-center justify-center shadow-lg active:scale-95 transition-transform duration-200">
                Tiếp tục
            </button>
<button class="w-full h-[56px] bg-surface-container-lowest text-on-surface border border-outline/30 font-pinyin-md text-pinyin-md rounded-xl flex items-center justify-center active:scale-95 transition-transform duration-200">
                Xem lại lỗi sai
            </button>
</div>
</main>
</body></html>
