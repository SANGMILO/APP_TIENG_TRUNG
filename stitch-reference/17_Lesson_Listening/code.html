<style>
        body { background-color: theme('colors.background'); color: theme('colors.on-background'); }

            0%, 100% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }
        .audio-playing .play-icon { animation: pulse-soft 2s infinite; }
        
        /* Audio waveform simulation */
        .waveform-bar {
            width: 4px;
            background-color: theme('colors.primary');

            transition: height 0.2s ease-in-out;

<body class="min-h-screen flex flex-col antialiased">

<header class="fixed top-0 left-0 w-full z-50 flex items-center justify-between px-container-margin h-14 bg-surface dark:bg-surface-dim flat no shadows"><button class="p-2 -ml-2 text-primary dark:text-primary-fixed-dim hover:bg-surface-container-low dark:hover:bg-surface-container-high transition-colors rounded-full active:scale-95 transition-transform duration-200">

<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg font-bold text-primary dark:text-primary-fixed-dim text-center flex-1 truncate px-4">

<!-- Main Content Canvas -->

<!-- Progress Bar (Contextual addition for learning flow) -->

<div class="h-full bg-tertiary rounded-full w-3/4"></div>
</div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-xl text-center">
            Nghe và chọn đáp án đúng
        </h2>
<!-- Audio Player Section -->
<div class="flex flex-col items-center justify-center bg-surface-container-lowest rounded-xl p-xl shadow-[0px_4px_20px_rgba(172,0,30,0.05)] border border-surface-container-highest mb-xl relative overflow-hidden group cursor-pointer" id="audioPlayer"><!-- Decorative background blob -->
<div class="absolute inset-0 opacity-10 bg-gradient-to-tr from-primary-container to-transparent rounded-xl pointer-events-none"></div>
<!-- Play Button Container -->
<div class="w-28 h-28 bg-primary rounded-full flex items-center justify-center shadow-xl relative z-10 mb-lg transition-transform hover:scale-105 active:scale-95">
<span class="material-symbols-outlined fill text-on-primary text-6xl play-icon">play_arrow</span>
</div>
<!-- Fake Waveform -->
<div class="flex items-end justify-center gap-1 h-12 w-full max-w-[200px] mb-md" id="waveform">
<div class="waveform-bar h-4"></div>
<div class="waveform-bar h-8"></div>
<div class="waveform-bar h-3"></div>
<div class="waveform-bar h-10"></div>
<div class="waveform-bar h-6"></div>
<div class="waveform-bar h-12"></div>
<div class="waveform-bar h-7"></div>
<div class="waveform-bar h-4"></div>
<div class="waveform-bar h-9"></div>
<div class="waveform-bar h-5"></div>
</div>
<p class="font-body-vn text-body-vn text-secondary text-center">Nhấn để nghe</p></div>
<!-- Question Text -->
<p class="font-body-vn text-body-vn text-on-surface mb-lg text-center">
            Bạn nghe thấy câu nào?
        </p>
<!-- Answer Options (Bento-style grid) -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-md mb-xl flex-1">
<!-- Option A -->
<label class="relative flex items-center p-lg cursor-pointer rounded-xl bg-surface-container-lowest border border-surface-container-highest shadow-[0px_4px_20px_rgba(172,0,30,0.05)] hover:bg-surface-container-low transition-colors has-[:checked]:border-primary has-[:checked]:bg-primary-container/10">
<input class="peer sr-only" name="answer" type="radio" value="A">
<div class="w-8 h-8 rounded-full border-2 border-secondary-fixed-dim flex items-center justify-center mr-md peer-checked:border-primary peer-checked:bg-primary transition-all">

</div>

<div class="fixed bottom-0 left-0 w-full p-container-margin bg-surface/90 backdrop-blur-md border-t border-surface-container border-transparent z-40 flex justify-center">
<button class="w-full max-w-2xl h-14 bg-primary text-on-primary font-headline-lg-mobile text-[18px] font-bold rounded-xl shadow-lg active:scale-95 transition-transform duration-200">
            Kiểm tra
        </button>
</div>
<script>
        // Simple script to simulate audio playing interaction
        const player = document.getElementById('audioPlayer');
        const icon = player.querySelector('.material-symbols-outlined');
        const bars = document.querySelectorAll('.waveform-bar');
        let isPlaying = false;
        let animationInterval;

        player.addEventListener('click', () => {
            isPlaying = !isPlaying;
            
            if (isPlaying) {
                player.classList.add('audio-playing');
                icon.textContent = 'pause';
                
                // Animate waveform
                animationInterval = setInterval(() => {
                    bars.forEach(bar => {
                        const height = Math.random() * 40 + 8; // Random height between 8 and 48px
                        bar.style.height = `${height}px`;
                    });
                }, 150);
                
                // Auto stop after 3 seconds for demo
                setTimeout(() => {
                    if (isPlaying) player.click();
                }, 3000);
            } else {
                player.classList.remove('audio-playing');
                icon.textContent = 'play_arrow';
                clearInterval(animationInterval);
                
                // Reset waveform
                const defaultHeights = [4, 8, 3, 10, 6, 12, 7, 4, 9, 5];
                bars.forEach((bar, index) => {
                    bar.style.height = `${defaultHeights[index] * 4}px`; // approximate original relative heights
                });
            }
        });
    </script>
