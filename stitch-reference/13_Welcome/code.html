<style>

          .bg-coral-gradient {
              background: linear-gradient(135deg, #fcf9f8 0%, #ffdad7 100%);
          }
          .glass-panel {
              background: rgba(255, 255, 255, 0.7);
              backdrop-filter: blur(16px);
              -webkit-backdrop-filter: blur(16px);
              border: 1px solid rgba(255, 255, 255, 0.5);
          }
      </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-surface text-on-surface font-body-vn antialiased min-h-screen relative overflow-hidden flex items-center justify-center">
<!-- Background Decoration -->
<div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
<div class="absolute inset-0 bg-coral-gradient opacity-40"></div>
<!-- Stylized Hanzi Motif (Subtle Seal/Brush pattern) -->
<div class="absolute -right-32 top-10 opacity-5 rotate-12 scale-150">
<span class="font-display-hanzi text-[300px] text-primary">学</span>
</div>
<div class="absolute -left-16 bottom-0 opacity-[0.03] -rotate-6 scale-150">
<span class="font-display-hanzi text-[250px] text-primary">习</span>
</div>
</div>
<!-- Main Content Container (iPhone 14 Pro Max proportion simulation) -->
<main class="relative z-10 w-full max-w-[430px] min-h-[932px] md:min-h-screen flex flex-col justify-between px-container-margin py-xl overflow-hidden mx-auto shadow-2xl bg-surface/50 backdrop-blur-3xl md:border md:border-surface-variant md:rounded-[40px]">
<!-- Top Section: Logo & Branding -->
<div class="flex flex-col items-center pt-xl mt-lg animate-[fadeInDown_0.8s_ease-out]">
<!-- Logo Graphic Placeholder -->
<div class="w-24 h-24 mb-6 rounded-3xl bg-primary-container shadow-[0px_4px_20px_rgba(172,0,30,0.15)] flex items-center justify-center relative overflow-hidden group">
<div class="absolute inset-0 bg-gradient-to-tr from-primary to-primary-fixed opacity-90"></div>
<span class="material-symbols-outlined text-on-primary text-5xl relative z-10 font-light" style="font-variation-settings: 'FILL' 0;">
                    auto_awesome
                 </span>
</div>
<!-- Typography -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-2 tracking-tight text-center">
                 Hanzi Premium
             </h1>
<p class="font-pinyin-md text-pinyin-md text-secondary text-center max-w-[280px]">
                Nắm vững tiếng Trung với phương pháp hiện đại
             </p>
</div>
<!-- Middle Section: Feature Badges (Bento-style layout hint) -->
<div class="flex flex-col gap-sm w-full py-xl my-auto z-20">
<div class="glass-panel rounded-xl p-md flex items-center gap-md shadow-sm transform transition-all duration-300 hover:scale-[1.02] active:scale-95 opacity-0 animate-[fadeInUp_0.8s_ease-out_0.2s_forwards]">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">
                        school
                    </span>
</div>
<div>
<h3 class="font-label-sm text-label-sm text-on-surface mb-1">Cá nhân hoá</h3>
<p class="text-sm text-secondary">Lộ trình học AI tinh chỉnh theo bạn.</p>
</div>
</div>
<div class="glass-panel rounded-xl p-md flex items-center gap-md shadow-sm transform transition-all duration-300 hover:scale-[1.02] active:scale-95 opacity-0 animate-[fadeInUp_0.8s_ease-out_0.4s_forwards]">
<div class="w-12 h-12 rounded-full bg-tertiary-fixed flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-tertiary" style="font-variation-settings: 'FILL' 1;">
                        edit_document
                    </span>
</div>
<div>
<h3 class="font-label-sm text-label-sm text-on-surface mb-1">Thực hành viết</h3>
<p class="text-sm text-secondary">Nhận diện chữ Hán thông minh.</p>
</div>
</div>
<div class="glass-panel rounded-xl p-md flex items-center gap-md shadow-sm transform transition-all duration-300 hover:scale-[1.02] active:scale-95 opacity-0 animate-[fadeInUp_0.8s_ease-out_0.6s_forwards]">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-on-surface-variant" style="font-variation-settings: 'FILL' 1;">
                        neurology
                    </span>
</div>
<div>
<h3 class="font-label-sm text-label-sm text-on-surface mb-1">Ghi nhớ sâu</h3>
<p class="text-sm text-secondary">Khoa học lặp lại ngắt quãng (SRS).</p>
</div>
</div>
</div>

<div class="w-full flex flex-col items-center gap-lg pb-lg opacity-0 animate-[fadeIn_1s_ease-out_0.8s_forwards]">

<button class="w-full h-[56px] bg-primary text-on-primary rounded-xl font-label-sm text-[16px] leading-[24px] font-semibold tracking-wide shadow-[0px_4px_20px_rgba(172,0,30,0.25)] flex items-center justify-center gap-2 hover:opacity-90 active:scale-[0.98] transition-all duration-200 group">

                <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">
                    arrow_forward
                </span>
</button>
<!-- Secondary CTA -->
<button class="font-body-vn text-[14px] text-secondary hover:text-primary transition-colors">
                Đã có tài khoản? <span class="font-semibold text-on-surface">Đăng nhập</span>
</button>
</div>
</main>
<style>
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
