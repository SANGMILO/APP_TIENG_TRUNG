<!DOCTYPE html><html lang="vi"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Đăng nhập - Hanzi Premium</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

            theme: {
                extend: {
                    "colors": {
                        "surface-variant": "#e5e2e1",
                        "surface-container-high": "#eae7e7",
                        "surface-container": "#f0eded",

                        "inverse-primary": "#ffb3af",

                        "on-secondary": "#ffffff",
                        "secondary-fixed": "#e3e2e0",
                        "on-tertiary-fixed": "#002114",
                        "on-tertiary-container": "#bcfcd9",
                        "inverse-on-surface": "#f3f0ef",
                        "secondary-container": "#e0e0dd",
                        "secondary": "#5e5f5d",
                        "outline-variant": "#e7bcba",
                        "outline": "#926e6c",
                        "error-container": "#ffdad6",
                        "on-secondary-container": "#626361",
                        "on-primary-container": "#ffeae8",
                        "surface-bright": "#fcf9f8",
                        "tertiary-fixed": "#b1f0ce",
                        "on-background": "#1b1b1b",
                        "background": "#fcf9f8",
                        "on-tertiary": "#ffffff",
                        "primary-fixed": "#ffdad7",
                        "on-error-container": "#93000a",
                        "surface-dim": "#dcd9d9",
                        "surface-container-highest": "#e5e2e1",
                        "primary-fixed-dim": "#ffb3af",
                        "primary-container": "#d90429",
                        "on-surface": "#1b1b1b",
                        "secondary-fixed-dim": "#c7c6c4",
                        "inverse-surface": "#313030",
                        "surface-tint": "#bf0022",
                        "on-secondary-fixed-variant": "#464745",
                        "tertiary": "#205e44",
                        "on-primary-fixed-variant": "#930018",
                        "surface": "#fcf9f8",
                        "on-surface-variant": "#5d3f3d",
                        "on-error": "#ffffff",
                        "error": "#ba1a1a",
                        "primary": "#ac001e"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1.5rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "sm": "12px",
                        "gutter": "16px",
                        "container-margin": "20px",
                        "xl": "32px",
                        "xs": "8px",
                        "md": "16px",
                        "lg": "24px",
                        "base": "4px"
                    },
                    "fontFamily": {
                        "label-sm": ["Inter"],
                        "headline-lg": ["Montserrat"],
                        "pinyin-md": ["Inter"],
                        "headline-lg-mobile": ["Montserrat"],
                        "display-hanzi": ["Noto Sans SC"],
                        "body-vn": ["Inter"]
                    },
                    "fontSize": {
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "700" }],
                        "pinyin-md": ["18px", { "lineHeight": "24px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "34px", "fontWeight": "700" }],
                        "display-hanzi": ["64px", { "lineHeight": "80px", "fontWeight": "500" }],
                        "body-vn": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]

                }
            }
        }

<style>
        .hanzi-bg {
            position: absolute;
            top: 15%;
            right: -10%;
            font-size: 240px;
            color: rgba(172, 0, 30, 0.03);
            pointer-events: none;
            user-select: none;
            z-index: 0;
            line-height: 1;
        }
        
        .input-focus-ring:focus-within {
            border-color: #ac001e;
            box-shadow: 0 0 0 1px #ac001e;
        }
    </style>
</head>
<body class="bg-surface text-on-surface font-body-vn min-h-screen relative overflow-hidden flex flex-col items-center justify-center">
<!-- Translucent Background Decoration -->
<div class="hanzi-bg font-display-hanzi">你好</div>
<!-- Mobile Container (iPhone 14 Pro Max simulation) -->
<main class="w-full max-w-[430px] h-full min-h-screen bg-surface relative z-10 flex flex-col shadow-2xl md:min-h-[932px] md:h-auto md:rounded-[40px] md:overflow-hidden md:my-8 border-x-0 md:border md:border-surface-variant">
<!-- Top App Bar -->
<header class="flex justify-between items-center px-container-margin py-md w-full relative z-20">
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full text-secondary hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined" style="font-size: 24px;">arrow_back</span>
</button>
<div class="absolute left-1/2 -translate-x-1/2 flex items-center gap-2">
<div class="w-6 h-6 rounded-full bg-primary flex items-center justify-center">
<span class="text-on-primary font-bold text-[10px]">M</span>
</div>
<span class="font-headline-lg-mobile text-[16px] text-on-surface">Mandarin Master</span>
</div>
<div class="w-10 h-10"></div> <!-- Spacer for balance -->
</header>
<!-- Scrollable Content -->
<div class="flex-1 overflow-y-auto px-container-margin pt-xl pb-xl flex flex-col z-10 relative">
<!-- Heading Section -->
<div class="mb-xl">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-sm">Chào mừng trở lại</h1>
<p class="font-body-vn text-body-vn text-on-surface-variant">Tiếp tục hành trình chinh phục tiếng Trung của bạn.</p>
</div>
<!-- Login Form -->
<form class="space-y-lg flex-1">
<!-- Email Field -->
<div class="space-y-xs">
<div class="relative flex items-center bg-surface-container-low rounded-2xl border border-surface-variant input-focus-ring transition-all duration-200">
<span class="material-symbols-outlined text-secondary ml-md">mail</span>
<input class="w-full bg-transparent border-none py-md px-sm text-on-surface placeholder:text-secondary-fixed-dim focus:ring-0 font-body-vn" placeholder="Nhập địa chỉ email" required="" type="email">
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<div class="relative flex items-center bg-surface-container-low rounded-2xl border border-surface-variant input-focus-ring transition-all duration-200">
<span class="material-symbols-outlined text-secondary ml-md">lock</span>
<input class="w-full bg-transparent border-none py-md px-sm text-on-surface placeholder:text-secondary-fixed-dim focus:ring-0 font-body-vn" id="password" placeholder="Nhập mật khẩu" required="" type="password">
<button class="mr-md text-secondary hover:text-primary transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="toggleIcon">visibility_off</span>
</button>
</div>
</div>
<!-- Options Row -->
<div class="flex items-center justify-between mt-sm mb-xl">
<label class="flex items-center gap-2 cursor-pointer group">
<div class="relative flex items-center">
<input class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary/20 bg-surface-container-lowest transition-all" type="checkbox">
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Ghi nhớ đăng nhập</span>
</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-fixed-dim transition-colors" href="#">Quên mật khẩu?</a>
</div>
<!-- Primary CTA -->
<button class="w-full h-[56px] bg-primary text-on-primary rounded-2xl font-label-sm text-label-sm shadow-[0px_4px_20px_rgba(172,0,30,0.2)] hover:bg-surface-tint active:scale-[0.98] transition-all flex items-center justify-center mt-xl" type="submit">
                    Đăng nhập
                </button>
</form>
<!-- Social Logins -->
<div class="mt-xl">
<div class="relative flex items-center py-lg mb-md">
<div class="flex-grow border-t border-surface-variant opacity-50"></div>
<span class="flex-shrink-0 mx-4 text-on-surface-variant font-label-sm text-label-sm uppercase tracking-widest opacity-80">hoặc</span>
<div class="flex-grow border-t border-surface-variant opacity-50"></div>
</div>
<div class="space-y-md">
<button class="w-full h-[56px] bg-surface-container-lowest border border-surface-variant rounded-2xl text-on-surface font-label-sm text-label-sm flex items-center justify-center gap-sm hover:bg-surface-container-low transition-colors shadow-sm" type="button">
<svg class="w-5 h-5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-1 .67-2.28 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.67-.35-1.39-.35-2.09s.13-1.42.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
Tiếp tục với Google
</button>
<button class="w-full h-[56px] bg-surface-container-lowest border border-surface-variant rounded-2xl text-on-surface font-label-sm text-label-sm flex items-center justify-center gap-sm hover:bg-surface-container-low transition-colors shadow-sm" type="button">
<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M17.05 20.28c-.98.95-2.05 1.88-3.19 1.88-1.11 0-1.47-.68-2.75-.68-1.29 0-1.7.66-2.73.68-1.09.02-2.05-.85-3.11-1.88-2.16-2.11-3.81-5.96-3.81-9.3 0-5.31 3.45-8.12 6.72-8.12 1.72 0 3.35.63 4.41 1.24 1.06-.61 2.69-1.24 4.41-1.24 2.85 0 5.27 2.05 6.21 4.85-4.59 1.9-3.85 8.12.74 10.01-.65 1.64-1.55 3.27-2.9 4.56zM12.03 4.52c-.15-2.33 1.81-4.33 4.06-4.52.23 2.42-2.11 4.52-4.06 4.52z"></path>
</svg>
Tiếp tục với Apple
</button>
</div>
</div>
<!-- Footer -->
<div class="mt-xl text-center pb-xl">
<p class="font-body-vn text-body-vn text-on-surface-variant">
                    Chưa có tài khoản? 
                    <a class="text-primary font-semibold hover:underline decoration-2 underline-offset-4 transition-all" href="#">Đăng ký</a>
</p>
</div>
</div>
</main>
<script>
        function togglePassword() {
            const pwdInput = document.getElementById('password');
            const icon = document.getElementById('toggleIcon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                icon.textContent = 'visibility';
            } else {
                pwdInput.type = 'password';
                icon.textContent = 'visibility_off';
            }
        }
    </script>


</body></html>
