<!DOCTYPE html><html class="light" lang="vi"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Học - Bài học</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

      tailwind.config = {

        theme: {
          extend: {
            "colors": {
                    "secondary-fixed-dim": "#c7c6c4",

                    "tertiary-fixed": "#b1f0ce",
                    "surface-container-low": "#f6f3f2",
                    "surface-bright": "#fcf9f8",
                    "primary-fixed": "#ffdad7",
                    "inverse-primary": "#ffb3af",
                    "surface": "#fcf9f8",
                    "surface-dim": "#dcd9d9",
                    "on-primary": "#ffffff",
                    "on-primary-fixed": "#410005",
                    "inverse-surface": "#313030",
                    "tertiary-fixed-dim": "#95d4b3",
                    "on-secondary-fixed-variant": "#464745",
                    "surface-variant": "#e5e2e1",
                    "error": "#ba1a1a",
                    "tertiary": "#205e44",
                    "secondary-container": "#e0e0dd",
                    "surface-container-high": "#eae7e7",
                    "primary-container": "#d90429",
                    "tertiary-container": "#3b775b",
                    "outline": "#926e6c",
                    "on-tertiary-fixed": "#002114",
                    "surface-container": "#f0eded",
                    "on-tertiary-container": "#bcfcd9",
                    "on-primary-container": "#ffeae8",
                    "on-primary-fixed-variant": "#930018",
                    "background": "#fcf9f8",
                    "on-error-container": "#93000a",
                    "inverse-on-surface": "#f3f0ef",
                    "on-background": "#1b1b1b",
                    "on-error": "#ffffff",
                    "surface-tint": "#bf0022",
                    "on-secondary-fixed": "#1a1c1a",
                    "on-secondary-container": "#626361",
                    "surface-container-lowest": "#ffffff",
                    "secondary": "#5e5f5d",
                    "on-tertiary-fixed-variant": "#0e5138",
                    "outline-variant": "#e7bcba",
                    "on-tertiary": "#ffffff",
                    "on-surface-variant": "#5d3f3d"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "xl": "32px",
                    "md": "16px",
                    "lg": "24px",
                    "base": "4px",
                    "xs": "8px",
                    "sm": "12px",
                    "gutter": "16px",
                    "container-margin": "20px"
            },
            "fontFamily": {
                    "label-sm": [
                            "Inter"
                    ],
                    "display-hanzi": [
                            "Noto Sans SC"
                    ],
                    "headline-lg-mobile": [
                            "Montserrat"
                    ],
                    "headline-lg": [
                            "Montserrat"
                    ],
                    "pinyin-md": [
                            "Inter"
                    ],
                    "body-vn": [
                            "Inter"
                    ]
            },
            "fontSize": {
                    "label-sm": [
                            "12px",
                            {
                                    "lineHeight": "16px",
                                    "fontWeight": "600"
                            }
                    ],
                    "display-hanzi": [
                            "64px",
                            {
                                    "lineHeight": "80px",
                                    "fontWeight": "500"
                            }
                    ],
                    "headline-lg-mobile": [
                            "28px",
                            {
                                    "lineHeight": "34px",
                                    "fontWeight": "700"
                            }
                    ],
                    "headline-lg": [
                            "32px",
                            {
                                    "lineHeight": "40px",
                                    "fontWeight": "700"

                    ],
                    "pinyin-md": [
                            "18px",
                            {
                                    "lineHeight": "24px",
                                    "letterSpacing": "0.05em",
                                    "fontWeight": "500"

                    ],
                    "body-vn": [

        },
        },
      }

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background font-body-vn text-body-vn min-h-screen flex flex-col pb-safe">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex items-center justify-between px-container-margin h-14 bg-surface dark:bg-surface-dim shadow-[0px_4px_20px_rgba(172,0,30,0.05)] md:hidden">
<button class="w-10 h-10 flex items-center justify-center text-primary dark:text-primary-fixed-dim hover:bg-surface-container-low dark:hover:bg-surface-container-high transition-colors rounded-full active:scale-95 duration-200">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary dark:text-primary-fixed-dim text-center flex-1">Bài học</h1>
<button class="w-10 h-10 flex items-center justify-center text-primary dark:text-primary-fixed-dim hover:bg-surface-container-low dark:hover:bg-surface-container-high transition-colors rounded-full active:scale-95 duration-200">
<span class="material-symbols-outlined" data-icon="more_horiz">more_horiz</span>
</button>
</header>
<!-- Desktop Navigation (Hidden on Mobile) -->
<nav class="hidden md:flex fixed top-0 left-0 w-full z-50 items-center justify-between px-container-margin h-16 bg-surface shadow-[0px_4px_20px_rgba(172,0,30,0.05)]">
<div class="flex items-center gap-4">
<button class="w-10 h-10 flex items-center justify-center text-primary hover:bg-surface-container-low transition-colors rounded-full active:scale-95 duration-200">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<span class="font-headline-lg text-headline-lg font-bold text-primary">Brand</span>
</div>
<div class="flex gap-lg">
<a class="font-label-sm text-label-sm text-primary flex items-center gap-xs" href="#">
<span class="material-symbols-outlined" data-icon="school">school</span>
                Học
             </a>
<a class="font-label-sm text-label-sm text-on-surface-variant flex items-center gap-xs hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined" data-icon="auto_stories">auto_stories</span>
                Luyện tập
             </a>
<a class="font-label-sm text-label-sm text-on-surface-variant flex items-center gap-xs hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined" data-icon="military_tech">military_tech</span>
                Xếp hạng
             </a>
<a class="font-label-sm text-label-sm text-on-surface-variant flex items-center gap-xs hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined" data-icon="person">person</span>
                Cá nhân
             </a>
</div>
<button class="w-10 h-10 flex items-center justify-center text-primary hover:bg-surface-container-low transition-colors rounded-full active:scale-95 duration-200">
<span class="material-symbols-outlined" data-icon="more_horiz">more_horiz</span>
</button>
</nav>
<!-- Main Content Canvas -->
<main class="flex-1 mt-14 md:mt-16 pt-lg px-container-margin pb-[200px] flex flex-col items-center max-w-3xl mx-auto w-full gap-xl">
<!-- Progress Bar -->
<div class="w-full flex items-center gap-sm mt-md">
<div class="flex-1 h-3 bg-tertiary-fixed rounded-full overflow-hidden">
<div class="h-full bg-tertiary w-4/5 rounded-full"></div>
</div>
<span class="font-label-sm text-label-sm text-tertiary">8/10</span>
</div>
<!-- Question Prompt -->
<div class="w-full text-center mt-lg">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-background mb-xs">Chọn nghĩa đúng</h2>
<p class="font-body-vn text-body-vn text-on-surface-variant">Câu này có nghĩa là gì?</p>
</div>
<!-- Learning Card (Centered Question) -->
<div class="w-full bg-surface-container-lowest rounded-xl p-xl shadow-[0px_4px_20px_rgba(172,0,30,0.03)] border border-surface-container flex flex-col items-center justify-center gap-sm">
<div class="font-pinyin-md text-pinyin-md text-secondary tracking-widest">nǐ shì nǎ guó rén?</div>
<div class="font-display-hanzi text-display-hanzi text-on-background">你是哪国人？</div>
<div class="flex gap-xs mt-sm">
<span class="bg-primary-container text-on-primary-container font-label-sm text-label-sm px-3 py-1 rounded-full bg-opacity-20 text-primary">Câu hỏi</span>
<span class="bg-surface-variant text-on-surface-variant font-label-sm text-label-sm px-3 py-1 rounded-full">HSK 1</span>
</div>
</div>
<!-- Multiple Choice Options -->
<div class="w-full grid grid-cols-1 md:grid-cols-2 gap-md mt-md">
<!-- Option A -->
<button class="w-full bg-surface-container-lowest rounded-lg p-md shadow-sm border border-surface-container hover:bg-surface-container-low transition-colors text-left flex items-center gap-md">
<div class="w-8 h-8 rounded-full bg-surface-variant text-on-surface-variant flex items-center justify-center font-bold">A</div>
<span class="font-body-vn text-body-vn text-on-background flex-1">Tên bạn là gì?</span>
</button>
<!-- Option B (Correct & Active State) -->
<button class="w-full bg-tertiary-fixed bg-opacity-20 rounded-lg p-md shadow-md border-2 border-tertiary transition-all text-left flex items-center gap-md relative overflow-hidden">
<div class="absolute inset-0 bg-tertiary opacity-5"></div>
<div class="w-8 h-8 rounded-full bg-tertiary text-on-primary flex items-center justify-center font-bold z-10 shadow-sm">
<span class="material-symbols-outlined text-sm" data-icon="check">check</span>
</div>
<span class="font-body-vn text-body-vn text-tertiary font-medium flex-1 z-10">Bạn là người nước nào?</span>
</button>
<!-- Option C -->
<button class="w-full bg-surface-container-lowest rounded-lg p-md shadow-sm border border-surface-container hover:bg-surface-container-low transition-colors text-left flex items-center gap-md">
<div class="w-8 h-8 rounded-full bg-surface-variant text-on-surface-variant flex items-center justify-center font-bold">C</div>
<span class="font-body-vn text-body-vn text-on-background flex-1">Tôi là người Việt Nam.</span>
</button>
<!-- Option D -->
<button class="w-full bg-surface-container-lowest rounded-lg p-md shadow-sm border border-surface-container hover:bg-surface-container-low transition-colors text-left flex items-center gap-md">
<div class="w-8 h-8 rounded-full bg-surface-variant text-on-surface-variant flex items-center justify-center font-bold">D</div>
<span class="font-body-vn text-body-vn text-on-background flex-1">Bạn khỏe không?</span>
</button>
</div>
</main>
<!-- Bottom Feedback Panel (Jade Green Accent for Correct Answer) -->
<div class="fixed bottom-0 left-0 w-full bg-tertiary-fixed bg-opacity-20 backdrop-blur-md border-t-2 border-tertiary md:p-lg flex flex-col md:flex-row items-start md:items-center justify-between gap-md z-40 transform transition-transform duration-300 translate-y-0 px-container-margin py-sm">
<div class="flex items-start md:items-center gap-md flex-1">
<div class="w-12 h-12 rounded-full bg-tertiary flex flex-shrink-0 items-center justify-center text-on-primary shadow-lg">
<span class="material-symbols-outlined text-2xl" data-icon="check">check</span>
</div>
<div class="flex flex-col gap-1">
<h3 class="font-headline-lg-mobile text-xl font-bold text-tertiary">Tuyệt vời!</h3>
<p class="font-display-hanzi text-lg text-on-background">你是哪国人？</p>
<p class="font-body-vn text-body-vn text-on-surface-variant">Bạn là người nước nào?</p>
<div class="flex items-center gap-xs mt-1 text-tertiary font-medium">
<span class="material-symbols-outlined text-sm" data-icon="stars">stars</span>
                     +10 XP
                 </div>
</div>
</div>
<button class="w-full md:w-auto h-14 px-8 bg-primary text-on-primary font-bold rounded-lg shadow-lg hover:bg-surface-tint transition-colors active:scale-95">
            Tiếp tục
        </button>
</div>


</body></html>
